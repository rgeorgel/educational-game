server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Cabeçalhos de segurança (valem para todas as respostas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # DNS interno do Docker: o nome "api" é resolvido de novo quando o container é recriado
    # (sem isso o nginx guarda o IP antigo e responde 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://edugame-api:8080;

    # API .NET (mesma origem → sem CORS)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manifesto do PWA com o tipo certo.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # O service worker nunca pode ficar em cache, senão o app não se atualiza.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Arquivos estáticos: revalidar sempre (ETag) para refletir edições na hora
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
