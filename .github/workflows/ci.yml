name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Os testes de integração usam Testcontainers (Docker já disponível no runner)
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da API
        run: docker build -t edugame-api ./backend
      - name: Validar docker compose
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
