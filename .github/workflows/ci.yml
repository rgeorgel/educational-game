name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Os testes de integração usam Testcontainers (Docker já disponível no runner)
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traduções do jogo (inglês e espanhol) completas
        run: python3 scripts/check_i18n.py --sobras

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da API
        run: docker build -t edugame-api ./backend
      - name: Build da imagem do painel admin
        run: docker build -t edugame-admin ./admin
      - name: Build da imagem web (nginx + frontend)
        run: docker build -f nginx/Dockerfile -t edugame-web .
      - name: Validar docker compose (banco local em container)
        run: COMPOSE_PROFILES=local-db DB_PASSWORD=ci docker compose config --quiet
      - name: Validar docker compose (banco externo, sem container do banco)
        run: |
          # Como no Coolify: só o arquivo principal, sem o override de desenvolvimento.
          DB_HOST=db.exemplo DB_NAME=edugame DB_USER=u DB_PASSWORD=p docker compose -f docker-compose.yml config --services > services.txt
          DB_HOST=db.exemplo DB_NAME=edugame DB_USER=u DB_PASSWORD=p docker compose -f docker-compose.yml config | (! grep -q "source: .*frontend")
          cat services.txt
          ! grep -qx db services.txt
