# Google Analytics só nas páginas de divulgação (landing, professores e blog), nunca no jogo.
# $uri aqui já é o arquivo servido (ex.: "/" → /index.html, /blog/x → /blog/x.html).
# O script fica em js/analytics.js e só carrega depois do aceite no aviso de cookies.
map $uri $csp_ga_pages {
    default                                                    0;
    ~^/((en|es)/)?(index|professores|teachers|profesores)\.html$  1;
    ~^/((en|es)/)?blog/[^/]+\.html$                             1;
}

map $csp_ga_pages $csp_ga_script {
    1       " https://*.googletagmanager.com";
    default "";
}

map $csp_ga_pages $csp_ga_connect {
    1       " https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com";
    default "";
}

map $csp_ga_pages $csp_ga_img {
    1       " https://*.google-analytics.com https://*.googletagmanager.com";
    default "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # UTF-8 para HTML, robots.txt, llms.txt e sitemap.xml (acentos corretos).
    charset utf-8;
    # Redirecionamentos relativos: atrás de proxy (Coolify) a porta/host internos não vazam.
    absolute_redirect off;
    client_max_body_size 1m;

    # Cabeçalhos de segurança (valem para todas as respostas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:$csp_ga_img; style-src 'self'; script-src 'self'$csp_ga_script; connect-src 'self'$csp_ga_connect; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # DNS interno do Docker: o nome "api" é resolvido de novo quando o container é recriado
    # (sem isso o nginx guarda o IP antigo e responde 502 até ser reiniciado).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://edugame-api:8080;

    # API .NET (mesma origem → sem CORS)
    location /api/ {
        # Durante um deploy a API fica alguns segundos fora: em vez de 502, responde 503 com
        # Retry-After e o app (js/api.js) tenta de novo sozinho.
        proxy_intercept_errors off;
        error_page 502 504 = @api_indisponivel;
        proxy_connect_timeout 3s;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host mantém a porta (ex.: localhost:8880), para links de desenvolvimento saírem certos.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_indisponivel {
        default_type application/problem+json;
        add_header Retry-After "2" always;
        add_header Cache-Control "no-store" always;
        add_header X-Api-Indisponivel "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"title":"Servidor reiniciando","detail":"Estamos atualizando o jogo. Tente de novo em alguns segundos.","status":503}';
    }

    # Manifesto do PWA com o tipo certo.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # O service worker nunca pode ficar em cache, senão o app não se atualiza.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # O jogo (app de página única) fica em /jogar; a raiz é a landing page.
    location = /jogar {
        expires -1;
        try_files /jogar.html =404;
    }

    location = /jogar/ {
        return 301 /jogar$is_args$args;
    }

    # Página para professores (HTML estático, como a landing).
    location = /professores {
        expires -1;
        try_files /professores.html =404;
    }

    # Páginas legais (termos de uso e política de privacidade).
    location = /termos {
        expires -1;
        try_files /termos.html =404;
    }

    location = /privacidade {
        expires -1;
        try_files /privacidade.html =404;
    }

    # Blog estático (gerado por scripts/build_blog.py): /blog e /blog/nome-do-post.
    location = /blog {
        expires -1;
        try_files /blog/index.html =404;
    }

    location = /blog/ {
        return 301 /blog;
    }

    location = /blog/feed.xml {
        expires -1;
    }

    location ^~ /blog/ {
        expires -1;
        try_files $uri.html =404;
    }

    # Páginas em inglês e espanhol (HTML estático): /en/, /en/teachers, /es/profesores, /en/blog…
    location = /en {
        return 301 /en/;
    }

    location = /es {
        return 301 /es/;
    }

    location ~ ^/(en|es)/blog/?$ {
        expires -1;
        try_files /$1/blog/index.html =404;
    }

    location ~ ^/(en|es)/blog/([a-z0-9-]+)$ {
        expires -1;
        try_files /$1/blog/$2.html =404;
    }

    location ~ ^/(en|es)/([a-z0-9-]+)$ {
        expires -1;
        try_files /$1/$2.html =404;
    }

    # Arquivos estáticos: revalidar sempre (ETag) para refletir edições na hora
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
