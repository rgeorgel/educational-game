name: edugame

# Dois modos de banco de dados:
#
# - Local (desenvolvimento): o Postgres roda num container. Ative o perfil "local-db"
#   no .env com COMPOSE_PROFILES=local-db (o .env.example já vem assim).
#
# - Servidor: o Postgres fica fora do Docker. Não ative o perfil e informe no .env
#   DB_HOST, DB_PORT, DB_NAME, DB_USER e DB_PASSWORD. O container "db" nem é criado.

services:
  db:
    image: postgres:17-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edugame}
      POSTGRES_USER: ${DB_USER:-edugame}
      # Sem senha o Postgres se recusa a iniciar (erro claro no log).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Porta no seu computador para acessar o banco local (ex.: DBeaver, dotnet run).
      - "127.0.0.1:${DB_LOCAL_PORT:-${POSTGRES_PORT:-5433}}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nome único de propósito: em redes compartilhadas (ex.: "Connect to Predefined Network" do Coolify)
  # outro app pode ter um serviço chamado só "api", e o nginx acabaria falando com ele.
  edugame-api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Banco: no servidor, informe os dados do seu Postgres; localmente o padrão é o container "db".
      Database__Host: ${DB_HOST:-db}
      Database__Port: ${DB_PORT:-5432}
      Database__Name: ${DB_NAME:-edugame}
      Database__Username: ${DB_USER:-edugame}
      Database__Password: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
      Database__SslMode: ${DB_SSL_MODE:-Prefer}
      Database__MigrateOnStartup: ${DB_MIGRATE_ON_STARTUP:-${DATABASE_MIGRATE_ON_STARTUP:-true}}
      # Planos (Grátis / Professor Pro / Escola). Desligado = ninguém é limitado.
      Plans__Enforce: ${PLANS_ENFORCE:-false}
      # Pagamento pelo Stripe (veja "Pagamentos" no README). Sem estas variáveis, os planos
      # ficam no modo lançamento (escolha grátis, sem cobrança).
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__Prices__professor: ${STRIPE_PRICE_PROFESSOR:-}
      Stripe__Prices__familia: ${STRIPE_PRICE_FAMILIA:-}
      # Endereço público do site (links do pagamento e dos e-mails), ex.: https://educa-game.seu-dominio
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      # E-mails (veja "E-mails" no README). Sem SMTP_HOST e EMAIL_FROM nada é enviado.
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__ReplyTo: ${EMAIL_REPLY_TO:-}
    extra_hosts:
      # Permite usar Host=host.docker.internal para um Postgres instalado no próprio servidor (Linux).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        # Sem o perfil "local-db" o container do banco não existe; a API conecta no banco externo.
        required: false
    # Deploy mais curto: enquanto sobe, a saúde é verificada a cada 1 s (start_interval, Docker 25+),
    # então o proxy volta a mandar tráfego assim que a API responde. Ao parar, termina as requisições em andamento.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 1s

  web:
    # Frontend e configuração do nginx vão dentro da imagem (funciona em qualquer servidor/Coolify).
    # Para desenvolver com edição ao vivo, o docker-compose.override.yml monta as pastas locais.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    stop_grace_period: 10s
    healthcheck:
      # Plataformas como o Coolify só mandam tráfego para containers saudáveis.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s
    depends_on:
      # Não espera a API ficar saudável: o nginx sobe na hora e serve o site; enquanto a API
      # reinicia, /api responde 503 com Retry-After e o app tenta de novo sozinho.
      edugame-api:
        condition: service_started

  # Painel de super admin: serviço separado do jogo (não usa o código nem a API do jogo).
  # Lê o banco numa conexão em modo somente leitura; só as ações de plano escrevem (tabela subscriptions). Fica bloqueado até ADMIN_USERNAME e
  # ADMIN_PASSWORD serem definidos. Por padrão só abre em 127.0.0.1 (veja ADMIN_BIND no .env.example).
  edugame-admin:
    build: ./admin
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Admin__Username: ${ADMIN_USERNAME:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Admin__KeysPath: /keys
      Database__Host: ${DB_HOST:-db}
      Database__Port: ${DB_PORT:-5432}
      Database__Name: ${DB_NAME:-edugame}
      # Opcional: um usuário do banco só com permissão de leitura (ADMIN_DB_USER / ADMIN_DB_PASSWORD).
      Database__Username: ${ADMIN_DB_USER:-${DB_USER:-edugame}}
      Database__Password: ${ADMIN_DB_PASSWORD:-${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}}
      Database__SslMode: ${DB_SSL_MODE:-Prefer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      # Chaves do login do painel: sem isso, cada deploy desloga o admin.
      - admin-keys:/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
  admin-keys:
